name: Deploy to TestFlight

# Triggered manually (workflow_dispatch) or when a release is published.
# Manual runs let you pick iOS, macOS, or both.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to deploy'
        required: true
        default: 'both'
        type: choice
        options:
          - ios
          - mac
          - both
      changelog:
        description: 'TestFlight "What to Test" notes'
        required: false
        default: ''
        type: string
      distribute_external:
        description: 'Distribute to external testers after upload'
        required: false
        default: false
        type: boolean
  release:
    types: [published]

env:
  FASTLANE_SKIP_UPDATE_CHECK: true
  FASTLANE_DISABLE_COLORS: true
  CHANGELOG: ${{ github.event.inputs.changelog || github.event.release.body || '' }}

jobs:
  # ── iOS ─────────────────────────────────────────────────────────
  ios:
    if: |
      github.event_name == 'release' ||
      github.event.inputs.platform == 'ios' ||
      github.event.inputs.platform == 'both'
    name: iOS TestFlight
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build & Upload iOS to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY: ${{ secrets.ASC_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          FASTLANE_APPLE_EMAIL: ${{ secrets.FASTLANE_APPLE_EMAIL }}
          FASTLANE_TEAM_ID: ${{ secrets.FASTLANE_TEAM_ID }}
        run: bundle exec fastlane ios ios_testflight

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/LettersToMy.ipa
          retention-days: 7

  # ── macOS ───────────────────────────────────────────────────────
  mac:
    if: |
      github.event_name == 'release' ||
      github.event.inputs.platform == 'mac' ||
      github.event.inputs.platform == 'both'
    name: macOS TestFlight
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build & Upload macOS to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY: ${{ secrets.ASC_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          FASTLANE_APPLE_EMAIL: ${{ secrets.FASTLANE_APPLE_EMAIL }}
          FASTLANE_TEAM_ID: ${{ secrets.FASTLANE_TEAM_ID }}
        run: bundle exec fastlane ios mac_testflight

      - name: Upload PKG artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-pkg
          path: build/macos/LettersToMy.pkg
          retention-days: 7

  # ── summary ─────────────────────────────────────────────────────
  summary:
    if: always()
    needs: [ios, mac]
    runs-on: ubuntu-latest
    steps:
      - name: Deployment Summary
        run: |
          echo "## TestFlight Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| iOS      | ${{ needs.ios.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| macOS    | ${{ needs.mac.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Build: #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "Trigger: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
