name: Deploy to TestFlight

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to deploy'
        required: true
        default: 'ios'
        type: choice
        options: ['ios', 'macos', 'both']
      build_number:
        description: 'Build number'
        required: true
        type: string

permissions:
  contents: write

jobs:
  ios:
    if: inputs.platform == 'ios' || inputs.platform == 'both'
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          sed -i '' "s/CURRENT_PROJECT_VERSION: .*/CURRENT_PROJECT_VERSION: ${{ inputs.build_number }}/" project.yml
          # Scope the manual provisioning profile to the app target only.
          # Passing it as a global xcodebuild flag applies it to SwiftPM
          # package targets (Firebase, GoogleUtilities, ...), which fail with
          # "does not support provisioning profiles". Replacing the marker in
          # project.yml lets xcodegen attach it to the app target alone.
          sed -i '' "s/CI_IOS_PROFILE_UUID_PLACEHOLDER/b45ab7db-22b5-4323-aa81-b881079901b5/" project.yml
          xcodegen generate

      - name: Import signing certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/distribution.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          echo -n "$CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          PROFILE_PATH="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_PATH"
          echo -n "$PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH/b45ab7db.mobileprovision"
          echo -n "$PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH/b45ab7db-22b5-4323-aa81-b881079901b5.mobileprovision"
          echo "Profile size: $(wc -c < "$PROFILE_PATH/b45ab7db.mobileprovision") bytes"
          ls -la "$PROFILE_PATH/"
          echo "--- xcodebuild show provisioning profiles ---"
          xcodebuild -showBuildSettings -project LettersToMy.xcodeproj -scheme LettersToMy 2>&1 | grep -i "PROVISIONING_PROFILE\|DEVELOPMENT_TEAM" || true

      - name: Install ASC API key
        run: |
          mkdir -p ~/private_keys
          echo -n "${{ secrets.ASC_KEY }}" | base64 --decode > ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8

      - name: Archive and export
        run: |
          set -euo pipefail
          ARCHIVE_PATH="$RUNNER_TEMP/LettersToMy-iOS.xcarchive"
          EXPORT_DIR="$RUNNER_TEMP/export"
          EXPORT_PLIST="$RUNNER_TEMP/exportOptions.plist"

          /usr/libexec/PlistBuddy -c "Add :method string app-store-connect" "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :teamID string ${{ secrets.APPLE_TEAM_ID }}" "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :uploadSymbols bool true" "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :manageAppVersionAndBuildNumber bool false" "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles dict" "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:com.bayoumountainholdings.LettersToMy string b45ab7db-22b5-4323-aa81-b881079901b5" "$EXPORT_PLIST"

          xcodebuild archive \
            -project LettersToMy.xcodeproj \
            -scheme LettersToMy \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            CODE_SIGN_IDENTITY="Apple Distribution"

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_DIR" \
            -exportOptionsPlist "$EXPORT_PLIST"

          IPA_PATH=$(find "$EXPORT_DIR" -name '*.ipa' | head -1)
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"

      - name: Upload to TestFlight
        run: |
          xcrun altool --upload-app \
            -f "$IPA_PATH" \
            -t ios \
            --apiKey "${{ secrets.ASC_KEY_ID }}" \
            --apiIssuer "${{ secrets.ASC_ISSUER_ID }}"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LettersToMy-ios-build-${{ inputs.build_number }}
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error

  macos:
    if: inputs.platform == 'macos' || inputs.platform == 'both'
    runs-on: macos-26
    # The first macOS archive of a Firebase-linked app rebuilds the whole
    # SPM graph (FirebaseCore, GoogleUtilities, Promises, nanopb) for both
    # arm64 and x86_64, which can exceed the default 45 minutes on a cold
    # runner. Keep the timeout generous; only the macOS job needs it.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          sed -i '' "s/CURRENT_PROJECT_VERSION: .*/CURRENT_PROJECT_VERSION: ${{ inputs.build_number }}/" project.yml
          # Scope the manual provisioning profile to the app target only
          # (see iOS job comment for why global flags break SwiftPM packages).
          sed -i '' "s/CI_MACOS_PROFILE_UUID_PLACEHOLDER/91405fb4-afd9-4825-96a1-893de956e073/" project.yml
          xcodegen generate

      - name: Import Apple Distribution certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$CERTIFICATE_BASE64"
          test -n "$CERTIFICATE_PASSWORD"
          CERT_PATH="$RUNNER_TEMP/distribution.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          echo -n "$CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          test -s "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/xcodebuild \
            -T /usr/bin/xcrun \
            -T /usr/bin/pkgbuild \
            -T /usr/bin/productbuild
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign:,pkgbuild:,productbuild: \
            -s -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          # Persist for later steps (archive, packaging, re-unlock).
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
          echo "--- identities available for app signing ---"
          security find-identity -v "$KEYCHAIN_PATH"

      - name: Install macOS provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64_MAC }}
        run: |
          set -euo pipefail
          test -n "$PROFILE_BASE64"
          PROFILE_PATH="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_PATH"
          # Filename MUST be the embedded profile UUID; Xcode resolves
          # provisioning profiles by UUID, not by display name.
          echo -n "$PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH/91405fb4-afd9-4825-96a1-893de956e073.mobileprovision"
          echo "Profile size: $(wc -c < "$PROFILE_PATH/91405fb4-afd9-4825-96a1-893de956e073.mobileprovision") bytes"
          ls -la "$PROFILE_PATH/"

      - name: Import Mac Installer certificate
        env:
          INSTALLER_CERT_BASE64: ${{ secrets.APPLE_MAC_INSTALLER_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$INSTALLER_CERT_BASE64"
          INSTALLER_CERT_PATH="$RUNNER_TEMP/mac-installer.p12"
          echo -n "$INSTALLER_CERT_BASE64" | base64 --decode > "$INSTALLER_CERT_PATH"
          test -s "$INSTALLER_CERT_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$INSTALLER_CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/xcodebuild \
            -T /usr/bin/xcrun \
            -T /usr/bin/pkgbuild \
            -T /usr/bin/productbuild
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign:,pkgbuild:,productbuild: \
            -s -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          # Packaging credential only: signs the .pkg, never the .app, and is
          # NOT expected to appear in the app provisioning profile.
          INSTALLER_IDENTITY=$(security find-identity -v "$KEYCHAIN_PATH" | awk -F '"' '/3rd Party Mac Developer Installer/ {print $2; exit}')
          test -n "$INSTALLER_IDENTITY"
          echo "INSTALLER_IDENTITY=$INSTALLER_IDENTITY" >> "$GITHUB_ENV"
          echo "--- identities available for packaging ---"
          security find-identity -v "$KEYCHAIN_PATH"

      - name: Install ASC API key
        run: |
          mkdir -p ~/private_keys
          echo -n "${{ secrets.ASC_KEY }}" | base64 --decode > ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8

      - name: Archive (manual signing, Apple Distribution)
        run: |
          set -euo pipefail
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          ARCHIVE_PATH="$RUNNER_TEMP/LettersToMy-macOS.xcarchive"
          xcodebuild archive \
            -project LettersToMy.xcodeproj \
            -scheme LettersToMyMac \
            -configuration Release \
            -sdk macosx \
            -destination "generic/platform=macOS" \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            CODE_SIGN_IDENTITY="Apple Distribution"
          echo "ARCHIVE_PATH=$ARCHIVE_PATH" >> "$GITHUB_ENV"

      - name: Verify archived app signature
        run: |
          set -euo pipefail
          # Exactly one .app must exist in the archive; fail immediately if not.
          APP_BUNDLE_COUNT=$(find "$ARCHIVE_PATH/Products/Applications" -maxdepth 1 -name '*.app' -print | wc -l | tr -d ' ')
          test "$APP_BUNDLE_COUNT" -eq 1
          APP_PATH="$(find "$ARCHIVE_PATH/Products/Applications" -maxdepth 1 -name '*.app' -print | head -1)"
          test -d "$APP_PATH"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          echo "--- codesign verify (deep, strict) ---"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          echo "--- codesign details ---"
          codesign -dv --verbose=4 "$APP_PATH" 2>&1 | awk '/Identifier=|TeamIdentifier=|Authority=/{print "  " $0}'

      - name: Package signed PKG
        run: |
          set -euo pipefail
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # xcodebuild -exportArchive for macOS App Store validates the Mac
          # Installer cert against the app provisioning profile by subject and
          # fails ("doesn't include signing certificate") because the profile
          # can only embed one certificate. The archived .app is already
          # signed with Apple Distribution, so build the App Store package
          # directly with productbuild (the same tool Xcode's export uses)
          # and sign the PKG with the separate Mac Installer cert. No error
          # suppression: any packaging failure fails this step.
          PKG_PATH="$RUNNER_TEMP/LettersToMy.pkg"
          productbuild \
            --component "$APP_PATH" /Applications \
            --sign "$INSTALLER_IDENTITY" \
            "$PKG_PATH"
          test -f "$PKG_PATH"
          test -s "$PKG_PATH"
          echo "PKG_PATH=$PKG_PATH" >> "$GITHUB_ENV"
          echo "--- PKG signature ---"
          pkgutil --check-signature "$PKG_PATH"

      - name: Upload to TestFlight
        run: |
          set -euo pipefail
          test -f "$PKG_PATH"
          test -s "$PKG_PATH"
          xcrun altool --upload-app \
            -f "$PKG_PATH" \
            -t osx \
            --apiKey "${{ secrets.ASC_KEY_ID }}" \
            --apiIssuer "${{ secrets.ASC_ISSUER_ID }}"

      - name: Upload PKG artifact
        uses: actions/upload-artifact@v4
        with:
          name: LettersToMy-macos-build-${{ inputs.build_number }}
          path: ${{ env.PKG_PATH }}
          if-no-files-found: error

  summary:
    if: always()
    needs: [ios, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          echo "## TestFlight Deployment" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| iOS      | ${{ needs.ios.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| macOS    | ${{ needs.macos.result }} |" >> $GITHUB_STEP_SUMMARY
          echo ""
          echo "Build: #${{ inputs.build_number }}" >> $GITHUB_STEP_SUMMARY
