name: Deploy to TestFlight

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to deploy'
        required: true
        default: 'both'
        type: choice
        options:
          - ios
          - mac
          - both
      build_number:
        description: 'Build number (increment each upload)'
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: write

jobs:
  ios:
    if: |
      github.event_name == 'release' ||
      github.event.inputs.platform == 'ios' ||
      github.event.inputs.platform == 'both'
    name: iOS → TestFlight
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/core-data-cloudkit-sharing

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          BUILD_NUM="${{ github.event.inputs.build_number || github.run_number }}"
          sed -i '' "s/CURRENT_PROJECT_VERSION: .*/CURRENT_PROJECT_VERSION: ${BUILD_NUM}/" project.yml
          xcodegen generate

      - name: Import signing certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/distribution.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          echo -n "$CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

      - name: Install provisioning profile (iOS)
        env:
          PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          PROFILE_PATH="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_PATH"
          echo -n "$PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH/letters-to-my-ios.mobileprovision"
          ls -la "$PROFILE_PATH/"

      - name: Archive iOS app
        run: |
          set -euo pipefail
          ARCHIVE_PATH="$RUNNER_TEMP/LettersToMy-iOS.xcarchive"
          xcodebuild archive \
            -project LettersToMy.xcodeproj \
            -scheme LettersToMy \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE="e76f9d91-430c-4cad-bbed-086a2506a7f8"
          echo "ARCHIVE_PATH=$ARCHIVE_PATH" >> "$GITHUB_ENV"

      - name: Export IPA
        run: |
          set -euo pipefail
          EXPORT_DIR="$RUNNER_TEMP/export"
          EXPORT_PLIST="$RUNNER_TEMP/exportOptions.plist"
          /usr/libexec/PlistBuddy -c "Add :method string app-store-connect" "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :teamID string ${{ secrets.APPLE_TEAM_ID }}" "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :uploadSymbols bool true" "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :manageAppVersionAndBuildNumber bool false" "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles dict" "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:com.bayoumountainholdings.LettersToMy string e76f9d91-430c-4cad-bbed-086a2506a7f8" "$EXPORT_PLIST"
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_DIR" \
            -exportOptionsPlist "$EXPORT_PLIST" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE="e76f9d91-430c-4cad-bbed-086a2506a7f8"
          IPA_PATH=$(find "$EXPORT_DIR" -name '*.ipa' | head -1)
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"

      - name: Upload to TestFlight
        env:
          API_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          API_KEY_BASE64: ${{ secrets.ASC_KEY }}
        run: |
          set -euo pipefail
          KEY_PATH="$HOME/.private_keys/AuthKey_${API_KEY_ID}.p8"
          mkdir -p "$HOME/.private_keys"
          echo -n "$API_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          xcrun altool --upload-app \
            -f "$IPA_PATH" \
            -t ios \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER_ID"

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ${{ env.IPA_PATH }}
          retention-days: 7

  mac:
    if: |
      github.event_name == 'release' ||
      github.event.inputs.platform == 'mac' ||
      github.event.inputs.platform == 'both'
    name: macOS → TestFlight
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/core-data-cloudkit-sharing

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          BUILD_NUM="${{ github.event.inputs.build_number || github.run_number }}"
          sed -i '' "s/CURRENT_PROJECT_VERSION: .*/CURRENT_PROJECT_VERSION: ${BUILD_NUM}/" project.yml
          xcodegen generate

      - name: Import signing certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/distribution.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          echo -n "$CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

      - name: Install provisioning profile (macOS)
        env:
          PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64_MAC }}
        run: |
          set -euo pipefail
          PROFILE_PATH="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_PATH"
          echo -n "$PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH/letters-to-my-mac.mobileprovision"
          ls -la "$PROFILE_PATH/"

      - name: Archive macOS app
        run: |
          set -euo pipefail
          ARCHIVE_PATH="$RUNNER_TEMP/LettersToMy-macOS.xcarchive"
          xcodebuild archive \
            -project LettersToMy.xcodeproj \
            -scheme LettersToMyMac \
            -configuration Release \
            -sdk macosx \
            -destination "generic/platform=macOS" \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE="3b46dd54-9c35-4260-92f3-f51891d85010"
          echo "ARCHIVE_PATH=$ARCHIVE_PATH" >> "$GITHUB_ENV"

      - name: Export macOS app
        run: |
          set -euo pipefail
          EXPORT_DIR="$RUNNER_TEMP/export"
          EXPORT_PLIST="$RUNNER_TEMP/exportOptions.plist"
          /usr/libexec/PlistBuddy -c "Add :method string app-store-connect" "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :teamID string ${{ secrets.APPLE_TEAM_ID }}" "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :uploadSymbols bool true" "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :manageAppVersionAndBuildNumber bool false" "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles dict" "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:com.bayoumountainholdings.LettersToMy.mac string 3b46dd54-9c35-4260-92f3-f51891d85010" "$EXPORT_PLIST"
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_DIR" \
            -exportOptionsPlist "$EXPORT_PLIST" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE="e76f9d91-430c-4cad-bbed-086a2506a7f8"
          PKG_PATH=$(find "$EXPORT_DIR" -name '*.pkg' | head -1)
          echo "PKG_PATH=$PKG_PATH" >> "$GITHUB_ENV"

      - name: Upload to TestFlight (macOS)
        env:
          API_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          API_KEY_BASE64: ${{ secrets.ASC_KEY }}
        run: |
          set -euo pipefail
          KEY_PATH="$HOME/.private_keys/AuthKey_${API_KEY_ID}.p8"
          mkdir -p "$HOME/.private_keys"
          echo -n "$API_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          xcrun altool --upload-app \
            -f "$PKG_PATH" \
            -t osx \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER_ID"

      - name: Upload PKG artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-pkg
          path: ${{ env.PKG_PATH }}
          retention-days: 7

  summary:
    if: always()
    needs: [ios, mac]
    runs-on: ubuntu-latest
    steps:
      - name: Deployment Summary
        run: |
          echo "## TestFlight Deployment" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| iOS      | ${{ needs.ios.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| macOS    | ${{ needs.mac.result }} |" >> $GITHUB_STEP_SUMMARY
          echo ""
          echo "Build: #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
