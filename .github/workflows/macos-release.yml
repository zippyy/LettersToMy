name: macOS GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for manual test runs (e.g. 0.2.0 -> tag v0.2.0)'
        required: true
        type: string
      create_release:
        description: 'Create/update a GitHub Release (false = artifacts only)'
        required: true
        default: 'true'
        type: boolean

permissions:
  contents: write

# macOS direct-download distribution (Developer ID). This is a DIFFERENT
# channel from the Mac App Store / TestFlight path in testflight.yml.
#
#   App  signed with Developer ID Application  (NOT Apple Distribution)
#   PKG  signed with Developer ID Installer    (NOT 3rd Party Mac Developer Installer)
#   PKG  notarized, stapled, checksummed, published as a GitHub Release asset
#
# See docs/CI_SETUP.md for the required secrets. Certificates/profiles are
# GitHub Actions secrets - never commit them.

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag_name: ${{ steps.meta.outputs.tag_name }}
      pkg_name: ${{ steps.package.outputs.pkg_name }}
      sha256: ${{ steps.checksum.outputs.sha256 }}
      release_action: ${{ steps.release.outputs.action }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: meta
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#v}"
            test -n "$VERSION"
            TAG_NAME="v${VERSION}"
          else
            TAG_NAME="${GITHUB_REF_NAME}"
            VERSION="${TAG_NAME#v}"
            test -n "$VERSION"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        env:
          PROFILE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$PROFILE_BASE64"
          PROFILE_PATH="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_PATH"
          # Filename MUST be the embedded profile UUID; Xcode resolves
          # provisioning profiles by UUID, not by display name. Extract it
          # from the profile itself instead of hard-coding it.
          DECODED="$RUNNER_TEMP/developer-id.mobileprovision"
          echo -n "$PROFILE_BASE64" | base64 --decode > "$DECODED"
          test -s "$DECODED"
          UUID="$(security cms -D -i "$DECODED" 2>/dev/null | plutil -extract UUID raw -o - -)"
          test -n "$UUID"
          cp "$DECODED" "$PROFILE_PATH/$UUID.mobileprovision"
          echo "Installed Developer ID profile $UUID ($(wc -c < "$PROFILE_PATH/$UUID.mobileprovision") bytes)"
          # Scope the manual provisioning profile to the app target only,
          # same placeholder pattern as testflight.yml (a global xcodebuild
          # flag would leak into SwiftPM package targets like Firebase).
          sed -i '' "s/CI_MACOS_PROFILE_UUID_PLACEHOLDER/$UUID/" project.yml
          # Tag/dispatch version becomes the app's short version too, so the
          # bundle version matches the release file name.
          sed -i '' "s/MARKETING_VERSION: .*/MARKETING_VERSION: $VERSION/" project.yml
          xcodegen generate

      - name: Import Developer ID certificates
        env:
          APP_CERT_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64 }}
          INSTALLER_CERT_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$APP_CERT_BASE64"
          test -n "$INSTALLER_CERT_BASE64"
          test -n "$CERTIFICATE_PASSWORD"
          KEYCHAIN_PATH="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # Allow codesign/xcodebuild/productbuild/security to use the
          # identities without any GUI/keychain prompt on the headless
          # runner. pkgbuild/productbuild in the ACL prevents the package
          # creation hang seen previously.
          echo -n "$APP_CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/devid-app.p12"
          echo -n "$INSTALLER_CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/devid-installer.p12"
          test -s "$RUNNER_TEMP/devid-app.p12"
          test -s "$RUNNER_TEMP/devid-installer.p12"
          security import "$RUNNER_TEMP/devid-app.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/xcodebuild \
            -T /usr/bin/xcrun \
            -T /usr/bin/pkgbuild \
            -T /usr/bin/productbuild
          security import "$RUNNER_TEMP/devid-installer.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/xcodebuild \
            -T /usr/bin/xcrun \
            -T /usr/bin/pkgbuild \
            -T /usr/bin/productbuild
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign:,pkgbuild:,productbuild: \
            -s -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
          # Installer certs do not show under the codesigning policy; list
          # identities with the default (all-policies) lookup.
          APP_IDENTITY=$(security find-identity -v "$KEYCHAIN_PATH" | awk -F '"' '/Developer ID Application/ {print $2; exit}')
          INSTALLER_IDENTITY=$(security find-identity -v "$KEYCHAIN_PATH" | awk -F '"' '/Developer ID Installer/ {print $2; exit}')
          test -n "$APP_IDENTITY"
          test -n "$INSTALLER_IDENTITY"
          echo "APP_IDENTITY=$APP_IDENTITY" >> "$GITHUB_ENV"
          echo "INSTALLER_IDENTITY=$INSTALLER_IDENTITY" >> "$GITHUB_ENV"
          echo "--- identities in build keychain ---"
          security find-identity -v "$KEYCHAIN_PATH"

      - name: Archive (Developer ID Application)
        run: |
          set -euo pipefail
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          ARCHIVE_PATH="$RUNNER_TEMP/LettersToMy-Release.xcarchive"
          xcodebuild archive \
            -project LettersToMy.xcodeproj \
            -scheme LettersToMyMac \
            -configuration Release \
            -sdk macosx \
            -destination "generic/platform=macOS" \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            CODE_SIGN_IDENTITY="Developer ID Application"
          echo "ARCHIVE_PATH=$ARCHIVE_PATH" >> "$GITHUB_ENV"

      - name: Verify archived app signature
        run: |
          set -euo pipefail
          APP_BUNDLE_COUNT=$(find "$ARCHIVE_PATH/Products/Applications" -maxdepth 1 -name '*.app' -print | wc -l | tr -d ' ')
          test "$APP_BUNDLE_COUNT" -eq 1
          APP_PATH="$(find "$ARCHIVE_PATH/Products/Applications" -maxdepth 1 -name '*.app' -print | head -1)"
          test -d "$APP_PATH"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          echo "--- codesign verify (deep, strict) ---"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          echo "--- codesign details ---"
          codesign -dv --verbose=4 "$APP_PATH" 2>&1 | awk '/Identifier=|TeamIdentifier=|Authority=/{print "  " $0}'

      - name: Package Developer ID PKG
        id: package
        run: |
          set -euo pipefail
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          PKG_PATH="$RUNNER_TEMP/LettersToMy-$VERSION-macOS.pkg"
          productbuild \
            --component "$APP_PATH" /Applications \
            --sign "$INSTALLER_IDENTITY" \
            "$PKG_PATH"
          test -f "$PKG_PATH"
          test -s "$PKG_PATH"
          echo "PKG_PATH=$PKG_PATH" >> "$GITHUB_ENV"
          echo "PKG_NAME=$(basename "$PKG_PATH")" >> "$GITHUB_ENV"
          echo "pkg_name=$(basename "$PKG_PATH")" >> "$GITHUB_OUTPUT"
          echo "--- PKG signature ---"
          pkgutil --check-signature "$PKG_PATH"

      - name: Notarize (notarytool)
        id: notarize
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_${{ secrets.ASC_KEY_ID }}.p8"
          echo -n "${{ secrets.ASC_KEY }}" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          # --wait blocks until Apple returns a verdict; a non-zero exit
          # (invalid/other) fails the job. Never fire-and-forget.
          xcrun notarytool submit "$PKG_PATH" \
            --key "$KEY_PATH" \
            --key-id "${{ secrets.ASC_KEY_ID }}" \
            --issuer "${{ secrets.ASC_ISSUER_ID }}" \
            --wait

      - name: Staple and verify notarization
        run: |
          set -euo pipefail
          xcrun stapler staple "$PKG_PATH"
          xcrun stapler validate "$PKG_PATH"
          pkgutil --check-signature "$PKG_PATH"
          echo "--- spctl install assessment (advisory) ---"
          spctl --assess --type install --verbose=4 "$PKG_PATH" 2>&1 || true

      - name: Generate checksum
        id: checksum
        run: |
          set -euo pipefail
          SHA_FILE="$RUNNER_TEMP/$PKG_NAME.sha256"
          SHA256="$(shasum -a 256 "$PKG_PATH" | awk '{print $1}')"
          printf '%s  %s\n' "$SHA256" "$PKG_NAME" > "$SHA_FILE"
          test -s "$SHA_FILE"
          echo "SHA_FILE=$SHA_FILE" >> "$GITHUB_ENV"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "shasum: $SHA256"

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LettersToMy-${{ env.VERSION }}-macOS
          path: |
            ${{ env.PKG_PATH }}
            ${{ env.SHA_FILE }}
          if-no-files-found: error

      - name: Publish GitHub Release
        id: release
        if: github.event_name == 'push' || inputs.create_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Release exists: upload/replace ONLY our same-named assets.
            gh release upload "$TAG_NAME" "$PKG_PATH" "$SHA_FILE" \
              --repo "$GITHUB_REPOSITORY" --clobber
            echo "action=updated" >> "$GITHUB_OUTPUT"
          else
            gh release create "$TAG_NAME" "$PKG_PATH" "$SHA_FILE" \
              --repo "$GITHUB_REPOSITORY" \
              --title "LettersToMy $VERSION" \
              --generate-notes
            echo "action=created" >> "$GITHUB_OUTPUT"
          fi

      - name: Summary
        if: always()
        run: |
          echo "## macOS GitHub Release" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Version | $VERSION |" >> $GITHUB_STEP_SUMMARY
          echo "| GitHub Release PKG | $PKG_NAME |" >> $GITHUB_STEP_SUMMARY
          echo "| SHA-256 | ${{ steps.checksum.outputs.sha256 }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Notarization | ${{ steps.notarize.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| GitHub Release | ${{ steps.release.outputs.action }} |" >> $GITHUB_STEP_SUMMARY

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/devid-app.p12" "$RUNNER_TEMP/devid-installer.p12" "$RUNNER_TEMP/developer-id.mobileprovision"