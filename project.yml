name: LettersToMy
options:
  bundleIdPrefix: com.bayoumountainholdings
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "26.2"

packages:
  LettersToMyCore:
    path: .
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    majorVersion: 11.0.0

settings:
  base:
    SWIFT_VERSION: 6.0
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1

schemes:
  LettersToMy:
    build:
      targets:
        LettersToMy: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LettersToMyTests
  LettersToMyMac:
    build:
      targets:
        LettersToMyMac: all
    run:
      config: Debug

targets:
  LettersToMy:
    type: application
    platform: iOS
    sources:
      - path: Sources/LettersToMy
      - path: Resources
        buildPhase: resources
      - path: Config/GoogleService-Info.plist
        buildPhase: resources
    dependencies:
      - package: LettersToMyCore
      - package: Firebase
        product: FirebaseAnalytics
      - package: Firebase
        product: FirebaseCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bayoumountainholdings.LettersToMy
        PRODUCT_NAME: Letters to My
        SWIFT_MODULE_NAME: LettersToMy
        INFOPLIST_FILE: Config/Info-iOS.plist
        CODE_SIGN_ENTITLEMENTS: Config/LettersToMy-iOS.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Daughter AppIcon-Granddaughter AppIcon-Grandson AppIcon-Son"
        TARGETED_DEVICE_FAMILY: "1,2"
        # Filled in by the TestFlight CI workflow (sed) so the manual
        # provisioning profile applies ONLY to the app target, never to
        # SwiftPM package targets (Firebase et al.), which require
        # CODE_SIGN_STYLE Automatic.
        PROVISIONING_PROFILE_SPECIFIER: CI_IOS_PROFILE_UUID_PLACEHOLDER
    entitlements:
      path: Config/LettersToMy-iOS.entitlements
      properties:
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.bayoumountainholdings.LettersToMy
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)

  LettersToMyMac:
    type: application
    platform: macOS
    sources:
      - path: Sources/LettersToMy
      - path: Resources
        buildPhase: resources
      - path: Config/Firebase/macOS/GoogleService-Info.plist
        buildPhase: resources
    dependencies:
      - package: LettersToMyCore
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAnalytics
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bayoumountainholdings.LettersToMy.mac
        PRODUCT_NAME: Letters to My
        INFOPLIST_FILE: Config/Info-macOS.plist
        CODE_SIGN_ENTITLEMENTS: Config/LettersToMy-macOS.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        OTHER_LDFLAGS: ["$(inherited)", "-ObjC"]
        # Filled in by the TestFlight CI workflow (sed) so the manual
        # provisioning profile applies ONLY to the app target, never to
        # SwiftPM package targets (Firebase et al.), which require
        # CODE_SIGN_STYLE Automatic.
        PROVISIONING_PROFILE_SPECIFIER: CI_MACOS_PROFILE_UUID_PLACEHOLDER
    entitlements:
      path: Config/LettersToMy-macOS.entitlements
      properties:
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.bayoumountainholdings.LettersToMy
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(CFBundleIdentifier)
        # App Sandbox is mandatory for Mac App Store / TestFlight
        # distribution; network.client and user-selected file access are
        # required for CloudKit sync and backup import/export.
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true

  LettersToMyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/LettersToMyCoreTests
    dependencies:
      - target: LettersToMy
      - package: LettersToMyCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bayoumountainholdings.LettersToMyTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Letters to My.app/Letters to My"
