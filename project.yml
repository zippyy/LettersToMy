name: LettersToMy
options:
  bundleIdPrefix: com.bayoumountainholdings
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "16.0"

packages:
  LettersToMyCore:
    path: .

settings:
  base:
    SWIFT_VERSION: 6.0
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1

schemes:
  LettersToMy:
    build:
      targets:
        LettersToMy: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LettersToMyTests
  LettersToMyMac:
    build:
      targets:
        LettersToMyMac: all
    run:
      config: Debug

targets:
  LettersToMy:
    type: application
    platform: iOS
    sources:
      - path: Sources/LettersToMy
    resources:
      - path: Resources
    dependencies:
      - package: LettersToMyCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bayoumountainholdings.LettersToMy
        PRODUCT_NAME: Letters to My
        INFOPLIST_FILE: Config/Info-iOS.plist
        CODE_SIGN_ENTITLEMENTS: Config/LettersToMy-iOS.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
    entitlements:
      path: Config/LettersToMy-iOS.entitlements

  LettersToMyMac:
    type: application
    platform: macOS
    sources:
      - path: Sources/LettersToMy
    resources:
      - path: Resources
    dependencies:
      - package: LettersToMyCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bayoumountainholdings.LettersToMy.mac
        PRODUCT_NAME: Letters to My
        INFOPLIST_FILE: Config/Info-macOS.plist
        CODE_SIGN_ENTITLEMENTS: Config/LettersToMy-macOS.entitlements
        ENABLE_HARDENED_RUNTIME: YES
    entitlements:
      path: Config/LettersToMy-macOS.entitlements

  LettersToMyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/LettersToMyCoreTests
    dependencies:
      - target: LettersToMy
      - package: LettersToMyCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bayoumountainholdings.LettersToMyTests
